---
name: hashdump
category: credentials
description: >
  Dump local credentials: SAM hashes (username:RID:LM:NT), LSA Secrets
  (machine account, service passwords, DPAPI backup keys), cached domain
  credentials (DCC2/mscash2), and optionally LSASS process memory
  (MiniDump to memory for offline parsing with pypykatz/mimikatz).
  All operations are in-memory — no files written to disk.
  Requires SYSTEM or High-integrity with SeDebugPrivilege.
  If running as admin (non-SYSTEM), the BOF steals a SYSTEM token
  from winlogon.exe automatically.

author: "operator"
version: "1.0.0"
created: "2026-08-05"
updated: "2026-08-05"

execution_type: bof
bof_file: hashdump.x64.o
entry_point: go
bof_arch: x64
fork_run: true

compatibility:
  agent_min_version: "1.0.0"
  agent_max_version: "99.x"
  os:
    - windows_server_2012r2
    - windows_server_2016
    - windows_server_2019
    - windows_server_2022
    - windows_10
    - windows_11

arguments:
  - name: lsass
    type: int
    pack_type: i
    required: false
    default: 0
    description: >
      Include LSASS minidump (0 = skip, 1 = dump).
      LSASS dump can be 30-200MB. Output is raw minidump bytes
      suitable for offline parsing with pypykatz.
      Skipped by default for size/OPSEC reasons.

  - name: sam
    type: int
    pack_type: i
    required: false
    default: 1
    description: "Dump SAM hashes (1 = yes, 0 = skip)."

  - name: lsa
    type: int
    pack_type: i
    required: false
    default: 1
    description: "Dump LSA Secrets (1 = yes, 0 = skip)."

  - name: cached
    type: int
    pack_type: i
    required: false
    default: 1
    description: "Dump cached domain credentials / DCC2 (1 = yes, 0 = skip)."

output_format: raw

opsec_level: high
opsec_notes: >
  HIGH risk module. Opens sensitive registry hives (SAM, SECURITY, SYSTEM)
  which may trigger Sysmon EventID 12/13 and EDR registry access alerts.
  LSASS access triggers Sysmon EventID 10 (ProcessAccess).
  MiniDumpWriteDump loads dbghelp.dll and generates ETW events.
  Recommended to run via fork & run in a sacrificial process.
  SYSTEM token impersonation generates security log event 4672/4624.
  All operations are in-memory — no temp files, no reg save to disk.

timeout: 120
tags: [sam, lsa, lsass, credentials, hashdump, secrets, cached, dcc2, mimikatz]

references:
  - https://attack.mitre.org/techniques/T1003/002/
  - https://attack.mitre.org/techniques/T1003/004/
  - https://attack.mitre.org/techniques/T1003/005/
  - https://attack.mitre.org/techniques/T1003/001/
mitre_attack_id: T1003
