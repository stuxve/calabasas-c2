---
name: underlaycopy
category: credentials
description: >
  Copy a locked file (SAM, SYSTEM, ntds.dit, journals, etc.) by reading
  it directly from the NTFS volume via the MFT — bypasses file-lock
  semantics that would otherwise refuse a normal open. Adapted from
  Muz1K1zuM/UnderlayCopy_bof; adds a configurable source volume, a
  destination path argument, and framework logging.
  Requires SeBackupPrivilege.

author: "operator (adapted from Muz1K1zuM)"
version: "1.0.0"

execution_type: bof
bof_file: underlaycopy.x64.o
entry_point: go
bof_arch: x64

compatibility:
  agent_min_version: "1.0.0"
  dotnet_min_version: "native-c"
  os:
    - windows_server_2012r2
    - windows_server_2016
    - windows_server_2019
    - windows_server_2022
    - windows_server_2025
    - windows_10
    - windows_11

arguments:
  - name: src
    type: string
    required: true
    description: "Locked source path (e.g. C:\\Windows\\System32\\config\\SAM)."
    example: "C:\\Windows\\System32\\config\\SAM"
    pack_type: z
  - name: dst
    type: string
    required: true
    description: "Destination path for the copy — will be overwritten."
    example: "C:\\Windows\\Temp\\sam.bin"
    pack_type: z
  - name: volume
    type: string
    required: false
    default: "C"
    description: "Source volume drive letter (default C). Must match the volume the src file lives on."
    example: "C"
    pack_type: z
  - name: repair
    type: int
    required: false
    default: 0
    description: >
      Set to 1 to repair ESE databases (NTDS.dit) after copying.
      Uses esent.dll in-process to fix dirty shutdown state so
      impacket-secretsdump can parse the result.  Harmless on
      non-ESE files (just fails silently).
    example: "1"
    pack_type: i

output_format: raw

opsec_level: high
opsec_notes: >
  Opens the raw NTFS volume via \\.\<drive>: which touches
  Sysmon Event ID 9 (RawAccessRead) — a very high-signal detection.
  Also generates Security Event 4663 (object access) on the source
  path lookup. Prefer during noisy activity windows or immediately
  before rebooting the target if evasion matters.

timeout: 600
tags: [ntfs, mft, locked-file, sam, ntds, raw-disk, backup]
references:
  - https://github.com/Muz1K1zuM/UnderlayCopy_bof
mitre_attack_id: T1003.002
