---
name: asreproasting
category: tickets
description: >
  Request an AS-REP for a user account that does not require Kerberos
  pre-authentication, extracting a crackable $krb5asrep$ hash.
  Supports RC4 (etype 23) and AES (etypes 17/18) output formats.

author: "operator"
version: "1.0.0"

execution_type: bof
bof_file: asreproasting.x64.o
entry_point: go
bof_arch: x64

compatibility:
  agent_min_version: "1.0.0"
  agent_max_version: "99.x"

arguments:
  - name: user
    type: string
    pack_type: z
    required: true
    default: ""
    description: "Target username (sAMAccountName) with DONT_REQUIRE_PREAUTH set."
    example: "svc_legacy"

  - name: dc
    type: string
    pack_type: z
    required: false
    default: ""
    description: "Domain controller IP/hostname. Empty = auto-discover."
    example: "dc01.corp.local"

  - name: domain
    type: string
    pack_type: z
    required: false
    default: ""
    description: "Target domain FQDN. Empty = current domain."
    example: "corp.local"

  - name: aes
    type: int
    pack_type: i
    required: false
    default: 0
    description: "Request AES-encrypted AS-REP (tries AES128, then AES256). 1 = yes, 0 = RC4."

output_format: raw
opsec_level: low
opsec_notes: >
  Sends an AS-REQ without pre-authentication data. Event 4768 is logged
  on the DC with result code 0 (success) or 14 (etype not supported).
  No credential material is needed to perform this attack — only a valid
  username and network access to the DC on port 88.

timeout: 120
tags: [kerberos, asrep, roasting, tickets, credential-access]
references:
  - https://attack.mitre.org/techniques/T1558/004/
  - https://github.com/RalfHacker/Kerbeus-BOF
mitre_attack_id: T1558.004
