---
name: describeticket
category: tickets
description: >
  Parse and display detailed information from a base64-encoded Kerberos
  ticket (.kirbi), including service name, realm, user, timestamps,
  flags, and encryption type.

author: "operator"
version: "1.0.0"

execution_type: bof
bof_file: describeticket.x64.o
entry_point: go
bof_arch: x64

compatibility:
  agent_min_version: "1.0.0"
  agent_max_version: "99.x"

arguments:
  - name: ticket
    type: string
    pack_type: z
    required: true
    default: ""
    description: "Base64-encoded Kerberos ticket (.kirbi) to describe."

output_format: raw
opsec_level: low
opsec_notes: >
  Purely local operation — decodes and displays ticket fields from
  the provided base64 data. No network traffic or LSA interaction.

timeout: 30
tags: [kerberos, tickets, describe, parse]
references:
  - https://github.com/RalfHacker/Kerbeus-BOF
