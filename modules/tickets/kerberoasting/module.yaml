---
name: kerberoasting
category: tickets
description: >
  Request service tickets for SPNs and extract crackable hashes
  ($krb5tgs$ format). Supports using an existing TGT or performing
  AS-REQ without pre-authentication for the specified user.

author: "operator"
version: "1.0.0"

execution_type: bof
bof_file: kerberoasting.x64.o
entry_point: go
bof_arch: x64

compatibility:
  agent_min_version: "1.0.0"
  agent_max_version: "99.x"

arguments:
  - name: spn
    type: string
    pack_type: z
    required: true
    default: ""
    description: "Target SPN to roast (e.g. MSSQLSvc/sql01.corp.local:1433)."
    example: "MSSQLSvc/sql01.corp.local:1433"

  - name: ticket
    type: string
    pack_type: z
    required: false
    default: ""
    description: "Base64-encoded TGT (kirbi) to use for the TGS-REQ. Empty = use cached TGT."
    example: "doIFxjCCBcKgAwI..."

  - name: nopreauth
    type: string
    pack_type: z
    required: false
    default: ""
    description: "Username of an account with DONT_REQUIRE_PREAUTH. Uses AS-REQ to get a TGT without pre-auth first."
    example: "svc_legacy"

  - name: dc
    type: string
    pack_type: z
    required: false
    default: ""
    description: "Domain controller IP/hostname. Empty = auto-discover."
    example: "dc01.corp.local"

  - name: domain
    type: string
    pack_type: z
    required: false
    default: ""
    description: "Target domain FQDN. Empty = current domain."
    example: "corp.local"

output_format: raw
opsec_level: medium
opsec_notes: >
  Sends a TGS-REQ for the target SPN. Event 4769 is logged on the DC.
  Requesting RC4-encrypted tickets (etype 23) for a service that supports
  AES may stand out in detection. Using /nopreauth generates an additional
  AS-REQ (event 4768).

timeout: 120
tags: [kerberos, kerberoasting, spn, tickets, credential-access]
references:
  - https://attack.mitre.org/techniques/T1558/003/
  - https://github.com/RalfHacker/Kerbeus-BOF
mitre_attack_id: T1558.003
