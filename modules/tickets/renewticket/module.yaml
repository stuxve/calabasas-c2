---
name: renewticket
category: tickets
description: >
  Renew an existing Kerberos TGT using the renewal functionality in
  the KDC. Optionally inject the renewed ticket via pass-the-ticket.

author: "operator"
version: "1.0.0"

execution_type: bof
bof_file: renewticket.x64.o
entry_point: go
bof_arch: x64

compatibility:
  agent_min_version: "1.0.0"
  agent_max_version: "99.x"

arguments:
  - name: ticket
    type: string
    pack_type: z
    required: true
    default: ""
    description: "Base64-encoded TGT (.kirbi) to renew."

  - name: dc
    type: string
    pack_type: z
    required: false
    default: ""
    description: "Domain controller IP/hostname. Empty = auto-discover."

  - name: ptt
    type: int
    pack_type: i
    required: false
    default: 0
    description: "Pass-the-ticket: inject renewed TGT. 1 = yes."

output_format: raw
opsec_level: medium
opsec_notes: >
  Sends a TGS-REQ with the RENEW flag to the KDC. Generates a
  standard Kerberos renewal request (event 4768/4769).

timeout: 120
tags: [kerberos, tgt, renew, tickets]
references:
  - https://attack.mitre.org/techniques/T1558/
  - https://github.com/RalfHacker/Kerbeus-BOF
mitre_attack_id: T1558
