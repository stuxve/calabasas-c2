---
name: requesttgs
category: tickets
description: >
  Request a Kerberos TGS (service ticket) using an existing TGT.
  Supports cross-realm referrals, U2U (user-to-user), keylist requests,
  and OPSEC-safe mode. Can inject the resulting ticket directly via PTT.

author: "operator"
version: "1.0.0"

execution_type: bof
bof_file: requesttgs.x64.o
entry_point: go
bof_arch: x64

compatibility:
  agent_min_version: "1.0.0"
  agent_max_version: "99.x"

arguments:
  - name: service
    type: string
    pack_type: z
    required: false
    default: ""
    description: "Target SPN (e.g. CIFS/dc01.corp.local)."
    example: "CIFS/dc01.corp.local"

  - name: ticket
    type: string
    pack_type: z
    required: true
    default: ""
    description: "Base64-encoded TGT (.kirbi)."

  - name: domain
    type: string
    pack_type: z
    required: false
    default: ""
    description: "Target domain FQDN. Empty = current domain."
    example: "corp.local"

  - name: dc
    type: string
    pack_type: z
    required: false
    default: ""
    description: "Domain controller IP/hostname. Empty = auto-discover."

  - name: tgs
    type: string
    pack_type: z
    required: false
    default: ""
    description: "Base64-encoded TGS for S4U2Proxy."

  - name: targetdomain
    type: string
    pack_type: z
    required: false
    default: ""
    description: "Target domain for cross-realm requests."

  - name: targetuser
    type: string
    pack_type: z
    required: false
    default: ""
    description: "Target user for U2U requests."

  - name: enctype
    type: string
    pack_type: z
    required: false
    default: ""
    description: "Preferred encryption type: 'rc4' or 'aes256'."

  - name: ptt
    type: int
    pack_type: i
    required: false
    default: 0
    description: "Pass-the-ticket: inject into current session. 1 = yes."

  - name: opsec
    type: int
    pack_type: i
    required: false
    default: 0
    description: "OPSEC mode. 1 = yes."

  - name: keylist
    type: int
    pack_type: i
    required: false
    default: 0
    description: "Keylist request for RODC. 1 = yes."

  - name: u2u
    type: int
    pack_type: i
    required: false
    default: 0
    description: "User-to-user request. 1 = yes."

output_format: raw
opsec_level: medium
opsec_notes: >
  Generates a TGS-REQ to the KDC. Multiple TGS requests in rapid
  succession can trigger monitoring rules.

timeout: 120
tags: [kerberos, tgs, service-ticket, tickets]
references:
  - https://attack.mitre.org/techniques/T1558/
  - https://github.com/RalfHacker/Kerbeus-BOF
mitre_attack_id: T1558
